# book-collection database schema
# Machine-readable schema definition for documentation, code generation, and validation.
# Migrated from MySQL to PostgreSQL in May 2026 - see database/migrate_mysql_to_postgres.py.

database: book-collection
engine: PostgreSQL
extensions: [vector]

# Every table has a LastUpdate/updated_at column kept current by a shared
# BEFORE UPDATE trigger (update_last_update()), not a column-level
# "ON UPDATE" clause (Postgres has no such clause).
triggers:
  update_last_update:
    fires: BEFORE UPDATE
    applies_to: [books, books_read, books_tags, daily_page_records, images]
    sets: "LastUpdate = CURRENT_TIMESTAMP"

tables:

  books:
    description: Core book catalog. Each row is a unique physical book in the collection.
    primary_key: [BookId]
    indexes:
      idx_books_title: { columns: [Title] }
      idx_books_author: { columns: [Author] }
      idx_books_location: { columns: [Location] }
    columns:
      BookId:        { type: SERIAL, nullable: false }
      Title:         { type: VARCHAR(200), nullable: false }
      Author:        { type: VARCHAR(200), nullable: false }
      CopyrightDate: { type: TIMESTAMP, nullable: true }
      IsbnNumber:    { type: VARCHAR(13), nullable: true, description: "ISBN-10" }
      PublisherName:  { type: VARCHAR(50), nullable: true }
      CoverType:     { type: VARCHAR(30), nullable: true, description: "e.g. Hard, Soft" }
      Pages:         { type: SMALLINT, nullable: true }
      BookNote:      { type: TEXT, nullable: true, description: "Free-form notes" }
      Recycled:      { type: SMALLINT, nullable: true, description: "1 = recycled/donated, 0 = kept" }
      Location:      { type: VARCHAR(50), nullable: false, description: "e.g. Main Collection" }
      IsbnNumber13:  { type: VARCHAR(13), nullable: true, description: "ISBN-13" }
      LastUpdate:    { type: TIMESTAMP, nullable: false, default: CURRENT_TIMESTAMP }

  tag_labels:
    description: Tag vocabulary. Each label string is unique.
    primary_key: [TagId]
    indexes:
      tag_labels_label_key: { columns: [Label], unique: true }
    columns:
      TagId: { type: SERIAL, nullable: false }
      Label: { type: VARCHAR(50), nullable: true }

  books_read:
    description: Reading log. A book can have multiple entries (re-reads).
    primary_key: [BookId, ReadDate]
    foreign_keys:
      fk_books_read_book:
        column: BookId
        references: { table: books, column: BookId }
        on_delete: CASCADE
        on_update: CASCADE
    columns:
      BookId:     { type: INTEGER, nullable: false }
      ReadDate:   { type: DATE, nullable: false }
      ReadNote:   { type: TEXT, nullable: true }
      LastUpdate: { type: TIMESTAMP, nullable: false, default: CURRENT_TIMESTAMP }

  books_tags:
    description: Many-to-many join table linking books to tags.
    primary_key: [BookId, TagId]
    foreign_keys:
      fk_books_tags_book:
        column: BookId
        references: { table: books, column: BookId }
        on_delete: CASCADE
        on_update: CASCADE
      fk_books_tags_tag:
        column: TagId
        references: { table: tag_labels, column: TagId }
        on_delete: CASCADE
        on_update: CASCADE
    columns:
      BookId:     { type: INTEGER, nullable: false }
      TagId:      { type: INTEGER, nullable: false }
      LastUpdate: { type: TIMESTAMP, nullable: false, default: CURRENT_TIMESTAMP }

  complete_date_estimates:
    description: Reading pace tracking with estimated finish dates.
    primary_key: [RecordId]
    foreign_keys:
      fk_complete_date_estimates_book:
        column: BookId
        references: { table: books, column: BookId }
        on_delete: CASCADE
        on_update: CASCADE
    columns:
      RecordId:           { type: BIGSERIAL, nullable: false }
      BookId:             { type: INTEGER, nullable: false }
      StartDate:          { type: TIMESTAMP, nullable: false }
      LastReadablePage:   { type: BIGINT, nullable: false }
      EstimateDate:       { type: TIMESTAMP, nullable: true }
      EstimatedFinishDate: { type: TIMESTAMP, nullable: true }

  daily_page_records:
    description: Daily reading progress entries tied to an estimate session.
    primary_key: [RecordDate, RecordId]
    foreign_keys:
      fk_daily_page_records_record:
        column: RecordId
        references: { table: complete_date_estimates, column: RecordId }
        on_delete: CASCADE
        on_update: CASCADE
    columns:
      RecordDate: { type: TIMESTAMP, nullable: false }
      Page:       { type: BIGINT, nullable: false }
      RecordId:   { type: BIGINT, nullable: false }
      LastUpdate: { type: TIMESTAMP, nullable: false, default: CURRENT_TIMESTAMP }

  images:
    description: Book cover images and associated metadata.
    primary_key: [ImageId]
    foreign_keys:
      fk_images_book:
        column: BookId
        references: { table: books, column: BookId }
        on_delete: CASCADE
        on_update: CASCADE
    columns:
      ImageId:   { type: SERIAL, nullable: false }
      BookId:    { type: INTEGER, nullable: false }
      Name:      { type: VARCHAR(255), nullable: true }
      Url:       { type: VARCHAR(255), nullable: true }
      ImageType: { type: VARCHAR(64), nullable: true, default: "cover-face" }
      LastUpdate: { type: TIMESTAMP, nullable: false, default: CURRENT_TIMESTAMP }

  book_note_embeddings:
    description: RAG vector embeddings for book and reading notes (pgvector), used by semantic_search_notes.
    primary_key: [id]
    indexes:
      idx_bne_embedding_hnsw: { columns: [embedding], type: hnsw, opclass: vector_cosine_ops }
      idx_bne_unique_book_note: { columns: [bookid], unique: true, where: "source = 'book_note'" }
      idx_bne_unique_read_note: { columns: [bookid, read_date], unique: true, where: "source = 'read_note'" }
    foreign_keys:
      fk_bne_book:
        column: bookid
        references: { table: books, column: BookId }
        on_delete: CASCADE
        on_update: CASCADE
    columns:
      id:         { type: SERIAL, nullable: false }
      bookid:     { type: INTEGER, nullable: false }
      source:     { type: VARCHAR(20), nullable: false, check: "source IN ('book_note', 'read_note')" }
      read_date:  { type: DATE, nullable: true }
      content:    { type: TEXT, nullable: false }
      embedding:  { type: "vector(768)", nullable: true, description: "Dimension must match ai_agent.embed_dimensions in configuration.json" }
      updated_at: { type: TIMESTAMP, nullable: false, default: CURRENT_TIMESTAMP }

# Relationship summary (for quick reference by tools and code generators)
relationships:
  - parent: books
    child: books_read
    cardinality: one-to-many
    join: "books.BookId = books_read.BookId"

  - parent: books
    child: books_tags
    cardinality: one-to-many
    join: "books.BookId = books_tags.BookId"

  - parent: tag_labels
    child: books_tags
    cardinality: one-to-many
    join: "tag_labels.TagId = books_tags.TagId"

  - parent: books
    child: complete_date_estimates
    cardinality: one-to-many
    join: "books.BookId = complete_date_estimates.BookId"

  - parent: complete_date_estimates
    child: daily_page_records
    cardinality: one-to-many
    join: "complete_date_estimates.RecordId = daily_page_records.RecordId"

  - parent: books
    child: images
    cardinality: one-to-many
    join: "books.BookId = images.BookId"

  - parent: books
    child: book_note_embeddings
    cardinality: one-to-many
    join: "books.BookId = book_note_embeddings.bookid"
